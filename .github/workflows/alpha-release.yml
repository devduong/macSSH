name: Alpha Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # Safeguard: only run on the public repository to avoid consuming private macOS CI/CD quota
    if: github.event.repository.private == false
    uses: ./.github/workflows/build-dmg.yml
    with:
      channel: alpha

  publish:
    name: Publish Alpha Pre-release
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packaged DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Publish or Update alpha GitHub Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
          ARCH_LABEL: ${{ needs.build.outputs.arch_label }}
          DMG_FILE: ${{ needs.build.outputs.dmg_file }}
          DMG_SHA256: ${{ needs.build.outputs.dmg_sha256 }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          set -euo pipefail
          TAG_NAME="alpha"
          BUILD_DATE_UTC=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          ASSET_PATH="dist/${DMG_FILE}"

          if [ ! -f "${ASSET_PATH}" ]; then
            echo "::error::Expected DMG artifact at ${ASSET_PATH}"
            exit 1
          fi

          LATEST_STABLE_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -n "${LATEST_STABLE_TAG}" ]; then
            CHANGELOG=$(git log --oneline --no-decorate "${LATEST_STABLE_TAG}..HEAD" | head -n 20 | sed 's/^/- /' || true)
          else
            CHANGELOG=$(git log --oneline --no-decorate -n 10 | sed 's/^/- /' || true)
          fi

          if [ -z "${CHANGELOG}" ]; then
            CHANGELOG="- $(git log -1 --oneline --no-decorate HEAD)"
          fi

          NOTES_FILE="${RUNNER_TEMP}/alpha_release_notes.md"
          {
            echo "## macSSH Alpha Pre-release"
            echo ""
            echo "> [!WARNING]"
            echo "> Automated pre-release build from \`main\` for early testing."
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| **Version** | \`${APP_VERSION}\` (Build \`${BUILD_NUMBER}\`) |"
            echo "| **Architecture** | \`${ARCH_LABEL}\` (\`arm64\` + \`x86_64\`) |"
            echo "| **Commit** | [\`${SHORT_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| **Built at** | \`${BUILD_DATE_UTC}\` |"
            echo "| **SHA-256 (\`${DMG_FILE}\`)** | \`${DMG_SHA256}\` |"
            echo ""
            echo "### Changes${LATEST_STABLE_TAG:+ since \`${LATEST_STABLE_TAG}\`}"
            echo "${CHANGELOG}"
          } > "${NOTES_FILE}"

          # Create or force-move the rolling 'alpha' tag to the built commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${TAG_NAME}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${TAG_NAME}"

          if gh release view "${TAG_NAME}" --json id >/dev/null 2>&1; then
            echo "Updating existing '${TAG_NAME}' pre-release..."

            OLD_ASSETS=$(gh release view "${TAG_NAME}" --json assets --jq '.assets[].name' || true)
            if [ -n "${OLD_ASSETS}" ]; then
              while IFS= read -r asset; do
                [ -z "$asset" ] && continue
                echo "Deleting old release asset: $asset"
                gh release delete-asset "${TAG_NAME}" "$asset" --yes
              done <<< "${OLD_ASSETS}"
            fi

            gh release upload "${TAG_NAME}" "${ASSET_PATH}" --clobber
            gh release edit "${TAG_NAME}" \
              --prerelease \
              --draft=false \
              --target "${GITHUB_SHA}" \
              --title "macSSH Alpha (${APP_VERSION} - ${SHORT_SHA})" \
              --notes-file "${NOTES_FILE}"
          else
            echo "Creating new '${TAG_NAME}' pre-release..."
            gh release create "${TAG_NAME}" "${ASSET_PATH}" \
              --prerelease \
              --title "macSSH Alpha (${APP_VERSION} - ${SHORT_SHA})" \
              --notes-file "${NOTES_FILE}"
          fi
