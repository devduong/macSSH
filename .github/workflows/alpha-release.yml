name: Alpha Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release-alpha:
    name: Build Universal DMG & Release (alpha)
    # Safeguard: only run on the public repository to avoid consuming private macOS CI/CD quota
    if: github.event.repository.private == false
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ] && [ -d "$XCODE_APP/Contents/Developer" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --show-sdk-path --sdk macosx

      - name: Load metadata from .env
        id: meta
        run: |
          set -euo pipefail
          if [ -f ".env" ]; then
            while IFS='=' read -r key val || [ -n "$key" ]; do
              [[ "$key" =~ ^[[:space:]]*# ]] && continue
              [[ -z "${key// /}" ]] && continue
              key=$(echo "$key" | tr -d '[:space:]')
              val=$(echo "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
              printf -v "$key" '%s' "$val"
            done < ".env"
          fi

          ARCH_LABEL="${ARCH_LABEL:-${ARCHITECTURE:-Universal}}"
          APP_NAME="${APP_NAME:-macSSH}"
          APP_VERSION="${APP_VERSION:-0.0.0}"
          BUILD_NUMBER="${BUILD_NUMBER:-1}"
          DMG_FILE="${APP_NAME}_${ARCH_LABEL}_${APP_VERSION}.dmg"
          SHORT_SHA=$(git rev-parse --short=7 "${GITHUB_SHA}")

          {
            echo "APP_NAME=${APP_NAME}"
            echo "APP_VERSION=${APP_VERSION}"
            echo "BUILD_NUMBER=${BUILD_NUMBER}"
            echo "ARCH_LABEL=${ARCH_LABEL}"
            echo "DMG_FILE=${DMG_FILE}"
            echo "SHORT_SHA=${SHORT_SHA}"
          } >> "$GITHUB_ENV"

          {
            echo "dmg_file=${DMG_FILE}"
            echo "app_version=${APP_VERSION}"
            echo "build_number=${BUILD_NUMBER}"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

          echo "Packaging ${APP_NAME} v${APP_VERSION} (Build ${BUILD_NUMBER}) [${ARCH_LABEL}] @ ${SHORT_SHA}"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('macSSH.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build Universal Release App
        run: |
          set -euo pipefail
          BUILD_DIR="build"

          xcodebuild \
            -project macSSH.xcodeproj \
            -scheme macSSH \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "${BUILD_DIR}/DerivedData" \
            -clonedSourcePackagesDirPath "${BUILD_DIR}/SourcePackages" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64 x86_64" \
            MARKETING_VERSION="${APP_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            MACSSH_VERSION="${APP_VERSION}" \
            MACSSH_BUILD_NUMBER="${BUILD_NUMBER}" \
            GCC_GENERATE_DEBUGGING_SYMBOLS=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            SWIFT_COMPILATION_MODE=wholemodule \
            DEAD_CODE_STRIPPING=YES \
            DEPLOYMENT_POSTPROCESSING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

          APP_BUNDLE="${BUILD_DIR}/${APP_NAME}.app"
          BUILT_APP="${BUILD_DIR}/DerivedData/Build/Products/Release/${APP_NAME}.app"
          if [ ! -d "${BUILT_APP}" ]; then
            echo "::error::Built app not found at ${BUILT_APP}"
            exit 1
          fi

          rm -rf "${APP_BUNDLE}"
          cp -R "${BUILT_APP}" "${BUILD_DIR}/"

          APP_EXECUTABLE=$(find "${APP_BUNDLE}/Contents/MacOS" -type f -perm +111 | head -n 1)
          if [ -z "${APP_EXECUTABLE}" ]; then
            echo "::error::Executable not found inside ${APP_BUNDLE}/Contents/MacOS"
            exit 1
          fi

          echo "Stripping debug symbols..."
          strip -r -u "$APP_EXECUTABLE" 2>/dev/null || strip -S -x "$APP_EXECUTABLE" 2>/dev/null || strip "$APP_EXECUTABLE" 2>/dev/null || true

          ARCH_INFO=$(lipo -info "$APP_EXECUTABLE")
          echo "Binary Architecture Info: ${ARCH_INFO}"
          if [[ "$ARCH_INFO" != *"arm64"* ]] || [[ "$ARCH_INFO" != *"x86_64"* ]]; then
            echo "::error::Expected Universal binary (arm64 + x86_64), got: ${ARCH_INFO}"
            exit 1
          fi

          xattr -cr "${APP_BUNDLE}" || true
          find "${APP_BUNDLE}" -name ".DS_Store" -delete || true

          echo "Ad-hoc signing app bundle..."
          codesign --force --deep --sign - "${APP_BUNDLE}"
          codesign --verify --deep --strict --verbose=2 "${APP_BUNDLE}"

      - name: Package DMG
        run: |
          set -euo pipefail
          BUILD_DIR="build"
          DMG_DIR="dmg-staging"

          rm -rf "${DMG_DIR}"
          mkdir -p "${DMG_DIR}"
          cp -R "${BUILD_DIR}/${APP_NAME}.app" "${DMG_DIR}/"
          ln -s /Applications "${DMG_DIR}/Applications"
          find "${DMG_DIR}" -name ".DS_Store" -delete || true

          for attempt in 1 2 3; do
            rm -f "${DMG_FILE}"
            if hdiutil create -volname "${APP_NAME}" \
              -srcfolder "${DMG_DIR}" \
              -ov -format UDZO \
              -imagekey zlib-level=9 \
              "${DMG_FILE}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::hdiutil create failed after 3 attempts"
              exit 1
            fi
            echo "hdiutil create failed (attempt ${attempt}), retrying in 5s..."
            sleep 5
          done

          rm -rf "${DMG_DIR}"

          SHA256=$(shasum -a 256 "${DMG_FILE}" | awk '{print $1}')
          echo "DMG_SHA256=${SHA256}" >> "$GITHUB_ENV"
          echo "Created ${DMG_FILE} ($(du -h "${DMG_FILE}" | cut -f1)), SHA-256: ${SHA256}"

      - name: Upload DMG workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ env.APP_VERSION }}-alpha-${{ env.SHORT_SHA }}
          path: ${{ env.DMG_FILE }}
          retention-days: 7

      - name: Publish or Update alpha GitHub Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="alpha"
          BUILD_DATE_UTC=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          LATEST_STABLE_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG_NAME}$" | head -n 1 || true)
          if [ -n "${LATEST_STABLE_TAG}" ]; then
            CHANGELOG=$(git log --oneline --no-decorate "${LATEST_STABLE_TAG}..HEAD" | head -n 20 | sed 's/^/- /' || true)
          else
            CHANGELOG=$(git log --oneline --no-decorate -n 10 | sed 's/^/- /' || true)
          fi

          if [ -z "${CHANGELOG}" ]; then
            CHANGELOG="- $(git log -1 --oneline --no-decorate HEAD)"
          fi

          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          cat <<EOF > "${NOTES_FILE}"
          ## macSSH Alpha Pre-release

          > [!WARNING]
          > Automated pre-release build from \`main\` for early testing.

          | Field | Value |
          | :--- | :--- |
          | **Version** | \`${APP_VERSION}\` (Build \`${BUILD_NUMBER}\`) |
          | **Architecture** | \`${ARCH_LABEL}\` (\`arm64\` + \`x86_64\`) |
          | **Commit** | [\`${SHORT_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |
          | **Built at** | \`${BUILD_DATE_UTC}\` |
          | **SHA-256 (\`${DMG_FILE}\`)** | \`${DMG_SHA256}\` |

          ### Changes${LATEST_STABLE_TAG:+ since \`${LATEST_STABLE_TAG}\`}
          ${CHANGELOG}
          EOF

          # Create or force-move the rolling 'alpha' tag to the built commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${TAG_NAME}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${TAG_NAME}"

          if gh release view "${TAG_NAME}" --json id >/dev/null 2>&1; then
            echo "Updating existing '${TAG_NAME}' pre-release..."

            OLD_ASSETS=$(gh release view "${TAG_NAME}" --json assets --jq '.assets[].name' || true)
            if [ -n "${OLD_ASSETS}" ]; then
              while IFS= read -r asset; do
                [ -z "$asset" ] && continue
                echo "Deleting old release asset: $asset"
                gh release delete-asset "${TAG_NAME}" "$asset" --yes
              done <<< "${OLD_ASSETS}"
            fi

            gh release upload "${TAG_NAME}" "${DMG_FILE}" --clobber
            gh release edit "${TAG_NAME}" \
              --prerelease \
              --draft=false \
              --target "${GITHUB_SHA}" \
              --title "macSSH Alpha (${APP_VERSION} - ${SHORT_SHA})" \
              --notes-file "${NOTES_FILE}"
          else
            echo "Creating new '${TAG_NAME}' pre-release..."
            gh release create "${TAG_NAME}" "${DMG_FILE}" \
              --prerelease \
              --title "macSSH Alpha (${APP_VERSION} - ${SHORT_SHA})" \
              --notes-file "${NOTES_FILE}"
          fi
